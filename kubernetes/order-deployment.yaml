apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 977881853088.dkr.ecr.us-east-1.amazonaws.com/order-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8082"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"