services:

  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    ports:
      - "8082:8082"

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      - inventory-service